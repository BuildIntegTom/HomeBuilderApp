<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="1180" height="760" fill="#fdfcf8"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#1c3d5a">Which row has no girts?</text>
  <text x="40" y="72" font-size="15" fill="#555">A shed roof, two storeys. Point at a letter and I'll know exactly what to change.</text>

  <!-- ================= NORTH / TALL WALL ================= -->
  <text x="60" y="126" font-size="17" font-weight="700" fill="#1c3d5a">NORTH — the tall wall</text>
  <text x="60" y="146" font-size="13" fill="#777">Flat on top. The roof starts here and falls away from you.</text>

  <!-- cross tilt wedge D -->
  <polygon points="60,168 380,168 380,182 60,196" fill="#c58f4a" stroke="#6b4a22" stroke-width="1.5"/>
  <!-- second storey B -->
  <rect x="60" y="196" width="320" height="150" fill="#d9c9a3" stroke="#6b4a22" stroke-width="1.5"/>
  <line x1="60" y1="246" x2="380" y2="246" stroke="#8a6a3a" stroke-width="3"/>
  <line x1="60" y1="296" x2="380" y2="296" stroke="#8a6a3a" stroke-width="3"/>
  <!-- floor line -->
  <rect x="60" y="346" width="320" height="14" fill="#b9a884" stroke="#6b4a22" stroke-width="1.5"/>
  <!-- ground storey A -->
  <rect x="60" y="360" width="320" height="150" fill="#d9c9a3" stroke="#6b4a22" stroke-width="1.5"/>
  <line x1="60" y1="410" x2="380" y2="410" stroke="#8a6a3a" stroke-width="3"/>
  <line x1="60" y1="460" x2="380" y2="460" stroke="#8a6a3a" stroke-width="3"/>
  <rect x="60" y="510" width="320" height="12" fill="#8a8a8a" stroke="#555" stroke-width="1.5"/>

  <!-- labels for north -->
  <circle cx="412" cy="180" r="15" fill="#c0392b"/><text x="412" y="186" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">D</text>
  <circle cx="412" cy="271" r="15" fill="#1c3d5a"/><text x="412" y="277" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">B</text>
  <circle cx="412" cy="435" r="15" fill="#1c3d5a"/><text x="412" y="441" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">A</text>

  <!-- ================= SIDE / GABLE END ================= -->
  <text x="640" y="126" font-size="17" font-weight="700" fill="#1c3d5a">EAST or WEST — a gable end</text>
  <text x="640" y="146" font-size="13" fill="#777">Sloped on top, following the roof down.</text>

  <!-- gable band C (sloped) -->
  <polygon points="640,168 640,250 960,290 960,168" fill="none" stroke="none"/>
  <polygon points="640,170 960,230 960,290 640,250" fill="#9fb8e0" stroke="#3c5a85" stroke-width="1.5"/>
  <!-- second storey -->
  <rect x="640" y="250" width="320" height="96" fill="#d9c9a3" stroke="#6b4a22" stroke-width="1.5"/>
  <line x1="640" y1="298" x2="960" y2="298" stroke="#8a6a3a" stroke-width="3"/>
  <rect x="640" y="346" width="320" height="14" fill="#b9a884" stroke="#6b4a22" stroke-width="1.5"/>
  <rect x="640" y="360" width="320" height="150" fill="#d9c9a3" stroke="#6b4a22" stroke-width="1.5"/>
  <line x1="640" y1="410" x2="960" y2="410" stroke="#8a6a3a" stroke-width="3"/>
  <line x1="640" y1="460" x2="960" y2="460" stroke="#8a6a3a" stroke-width="3"/>
  <rect x="640" y="510" width="320" height="12" fill="#8a8a8a" stroke="#555" stroke-width="1.5"/>

  <circle cx="992" cy="235" r="15" fill="#c0392b"/><text x="992" y="241" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">C</text>
  <circle cx="992" cy="300" r="15" fill="#1c3d5a"/><text x="992" y="306" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">B</text>
  <circle cx="992" cy="435" r="15" fill="#1c3d5a"/><text x="992" y="441" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">A</text>

  <!-- girt key -->
  <line x1="60" y1="548" x2="110" y2="548" stroke="#8a6a3a" stroke-width="3"/>
  <text x="120" y="553" font-size="13" fill="#555">= a girt row</text>

  <!-- ================= TABLE ================= -->
  <text x="60" y="600" font-size="16" font-weight="700" fill="#1c3d5a">What each one does today</text>

  <text x="60"  y="628" font-size="14" font-weight="700" fill="#1c3d5a">A, B</text>
  <text x="130" y="628" font-size="14" fill="#333">Ordinary wall panels, 10 ft each</text>
  <text x="520" y="628" font-size="14" fill="#2d6a3f">Girts: yes — one per 3 ft of span</text>

  <text x="60"  y="656" font-size="14" font-weight="700" fill="#c0392b">C</text>
  <text x="130" y="656" font-size="14" fill="#333">Gable band, follows the roof down</text>
  <text x="520" y="656" font-size="14" fill="#8a6a1a">Girts: only if 24″ or taller — your 3 ft rule</text>

  <text x="60"  y="684" font-size="14" font-weight="700" fill="#c0392b">D</text>
  <text x="130" y="684" font-size="14" fill="#333">Cross-tilt wedge the roof lands on</text>
  <text x="520" y="684" font-size="14" fill="#a33">Girts: none, and none would fit — it is 5–8″ tall</text>

  <text x="60" y="726" font-size="13" fill="#777">⚠ D is drawn thicker than it really is so you can see it. At 4:12 it is about 5″ at the low edge and 8″ at the high edge.</text>
</svg>
